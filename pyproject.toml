[project]
name = "foundations"
version = "0.1.0"
description = "A from-scratch neural network in NumPy covering every base concept"
readme = "README.md"
authors = [
    { name = "brian-rey-development", email = "brianrey3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
foundations = "foundations.cli:main"
foundations-api = "foundations.api.app:serve"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
